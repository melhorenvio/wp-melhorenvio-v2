name: Build plugin zip
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'URL do Melhor Integrador a usar no build'
        type: choice
        options:
          - dev
          - prod
        default: dev
permissions: {}
jobs:
  build:
    name: Build plugin zip
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Point Melhor Integrador to staging URL
        if: ${{ inputs.environment == 'dev' }}
        run: |
          for f in melhor-envio-beta.php src/Http/Controllers/Admin/AdminPageController.php; do
            [ -f "$f" ] && sed -i "s#https://woocommerceenvios.com#https://wordpress-envios.melhorenvio.work#g" "$f"
          done

      - name: Install PHP dependencies
        run: composer install --optimize-autoloader --no-dev --no-interaction

      - name: Install JS dependencies and build assets
        run: |
          npm install
          npm run build

      - name: Assemble plugin folder
        run: |
          mkdir -p dist/melhor-envio-cotacao
          rsync -a ./ dist/melhor-envio-cotacao/ \
            --exclude=.git \
            --exclude=.github \
            --exclude=.idea \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=caddy \
            --exclude=compose.yml \
            --exclude=Dockerfile \
            --exclude=custom-php-settings.ini \
            --exclude=.env \
            --exclude=.env.example \
            --exclude=Makefile \
            --exclude=.gitignore \
            --exclude=.gitattributes \
            --exclude=.distignore \
            --exclude=bin \
            --exclude=docs \
            --exclude=scripts \
            --exclude=patches \
            --exclude=tests \
            --exclude=phpunit.xml.dist \
            --exclude=.phpunit.cache \
            --exclude=sonar-project.properties \
            --exclude=.claude \
            --exclude=webpack.config.js \
            --exclude=package.json \
            --exclude=package-lock.json \
            --exclude=composer.lock \
            --exclude=config.json

      - name: Upload plugin artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: melhor-envio-cotacao-${{ inputs.environment }}
          path: dist
          retention-days: 7
